# Cloudflare Tunnel "xiaozhi" (id <TUNNEL_ID>) - chạy trong stack docker-compose_all.yml
# Chỉ public: trang quản lý + OTA, websocket cho robot, API vision. KHÔNG public: MySQL, Redis, VieNeu, ASR, voiceprint.
tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # Đăng nhập Google (phải đứng trước rule chung của xiaozhi.minizjp.com)
  - hostname: xiaozhi.minizjp.com
    path: ^/auth/
    service: http://xiaozhi-google-auth:8090
  # Trang quản lý + API + OTA (https://xiaozhi.minizjp.com/xiaozhi/ota/)
  - hostname: xiaozhi.minizjp.com
    service: http://xiaozhi-esp32-server-web:8002
  # WebSocket cho robot (wss://xiaozhi-ws.minizjp.com/xiaozhi/v1/)
  - hostname: xiaozhi-ws.minizjp.com
    service: http://xiaozhi-esp32-server:8000
  # Phân tích hình ảnh (https://xiaozhi-vision.minizjp.com/mcp/vision/explain)
  - hostname: xiaozhi-vision.minizjp.com
    service: http://xiaozhi-esp32-server:8003
  - service: http_status:404
